<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orbital brand image generator</title>
<!--
  Renders Orbital's brand images: particle wordmarks, the particle "o", the orb, an app icon and a banner.
  Uses the real wordmark font (Outfit) and the Neural Core's colour bands. Open with ?art=<name>&w=&h=
  (see ART below); scripts/render-brand.cjs saves every one as a PNG into brand/.
-->
<style>
  @font-face { font-family: "Outfit"; font-weight: 400; src: url("../node_modules/@fontsource/outfit/files/outfit-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Outfit"; font-weight: 700; src: url("../node_modules/@fontsource/outfit/files/outfit-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── The Neural Core palette and its colour bands (top to bottom), as in src/neural/geometry.ts ──
const PALETTE = ["#b02bff", "#ff2bd6", "#ff1f2e", "#ff5a1f", "#2f7dff", "#1fd0ff", "#ffd23a", "#ff9a1a", "#a6ff2e", "#2cff7a", "#7a2cff"];
const BANDS = [
  [1.0, "#ff1f2e", "#ff5a1f"], [0.6, "#ff5a1f", "#ff2bd6"], [0.3, "#ff9a1a", "#b02bff"], [0.0, "#ffd23a", "#ffd23a"],
  [-0.3, "#a6ff2e", "#ff9a1a"], [-0.55, "#1fd0ff", "#b02bff"], [-0.8, "#2f7dff", "#7a2cff"], [-1.0, "#7a2cff", "#2f7dff"],
];
const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const smooth = (t) => t * t * (3 - 2 * t);
function band(y, side) {
  const t = Math.max(-1, Math.min(1, y));
  let i = 0;
  while (i < BANDS.length - 2 && t < BANDS[i + 1][0]) i++;
  const [y0, a0, b0] = BANDS[i], [y1, a1, b1] = BANDS[i + 1];
  const f = smooth(Math.max(0, Math.min(1, (y0 - t) / (y0 - y1))));
  const s = side * 0.5 + 0.5;
  return lerp(lerp(rgb(a0), rgb(b0), s), lerp(rgb(a1), rgb(b1), s), f);
}
// Seeded randomness so every render is identical.
let seed = 7;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const noise = (x, y) => Math.sin(x * 1.7 + 1.3) * Math.sin(y * 2.3 + 0.4) * 0.6 + Math.sin(x * 3.1 + y * 1.3 + 2.1) * 0.4;

const P = new URLSearchParams(location.search);
const art = P.get("art") || "wordmark-dark";
const W = +(P.get("w") || 2400), H = +(P.get("h") || 1200);
const cv = document.getElementById("c"); cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

/** Colour of a speck at normalised position (nx, ny in -1..1), banded diagonally and swirled by noise. */
function colourAt(nx, ny) {
  if (rnd() < 0.05) return [255, 255, 255];                     // sparkles
  if (rnd() < 0.12) return rgb(PALETTE[(rnd() * PALETTE.length) | 0]); // glitter in any palette colour
  const h = -ny * 0.94 + nx * 0.34 + noise(nx * 2.2, ny * 2.2) * 0.35 + (rnd() - 0.5) * 0.12;
  return band(h, Math.max(-1, Math.min(1, nx * 1.3 + noise(ny * 2 + 4, nx * 2) * 0.6)));
}

/** Draw specks inside whatever is opaque on a mask canvas (the text), sampled on a jittered grid. */
function particlesFromMask(mask, { step = 5, size = [1.2, 3.4], light = false, box }) {
  const m = mask.getContext("2d").getImageData(0, 0, mask.width, mask.height).data;
  const { x0, y0, x1, y1 } = box;
  ctx.globalCompositeOperation = light ? "source-over" : "lighter";
  for (let y = 0; y < mask.height; y += step) for (let x = 0; x < mask.width; x += step) {
    const jx = x + (rnd() - 0.5) * step * 1.4, jy = y + (rnd() - 0.5) * step * 1.4;
    const ix = Math.max(0, Math.min(mask.width - 1, jx | 0)), iy = Math.max(0, Math.min(mask.height - 1, jy | 0));
    if (m[(iy * mask.width + ix) * 4 + 3] < 128) continue;
    const nx = ((jx - x0) / (x1 - x0)) * 2 - 1, ny = ((jy - y0) / (y1 - y0)) * 2 - 1;
    speck(jx, jy, colourAt(nx, ny), size, light);
  }
  ctx.globalCompositeOperation = "source-over";
}
function speck(x, y, c, size, light, alpha) {
  const r = size[0] + Math.pow(rnd(), 2.2) * (size[1] - size[0]);
  let col = c;
  if (light) { const m = Math.max(...c) || 1; col = c.map((v) => v / m * 255); const wht = Math.min(...col) / 255; col = col.map((v) => v * (1 - 0.6 * wht)); }
  const a = alpha ?? (light ? 0.55 + rnd() * 0.45 : 0.55 + rnd() * 0.6);
  ctx.fillStyle = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${Math.min(1, a)})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
/** Loose dust drifting off the shape, so it reads as particles rather than a texture. */
function dust(box, n, light, spread = 0.25) {
  const { x0, y0, x1, y1 } = box, w = x1 - x0, h = y1 - y0;
  ctx.globalCompositeOperation = light ? "source-over" : "lighter";
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = w / 2 * (1 + spread), ry = h / 2 * (1 + spread * 1.6);
  for (let i = 0; i < n; i++) {
    // A soft rounded cloud: denser near the shape, thinning out with distance (no hard edge).
    const a = rnd() * Math.PI * 2, d = Math.pow(rnd(), 0.65) * (1 + rnd() * 0.5);
    const x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d;
    const nx = ((x - x0) / w) * 2 - 1, ny = ((y - y0) / h) * 2 - 1;
    speck(x, y, colourAt(nx, ny), [0.6, 1.8], light, (0.12 + rnd() * 0.35) * Math.max(0.15, 1.2 - d));
  }
  ctx.globalCompositeOperation = "source-over";
}
/** Points on a sphere shell, projected: the orb. */
function orb(cx, cy, R, n, light, size = [0.8, 2.6]) {
  ctx.globalCompositeOperation = light ? "source-over" : "lighter";
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, sq = Math.sqrt(1 - u * u);
    const shell = rnd() < 0.86, r = shell ? 0.93 + rnd() * 0.07 : Math.cbrt(rnd()) * 0.9;
    const x = sq * Math.cos(th) * r, y = u * r, z = sq * Math.sin(th) * r;
    const depth = 0.55 + 0.45 * ((z + 1) / 2);
    const c = !shell ? lerp([255, 210, 90], [255, 248, 225], rnd()) : colourAt(x, -y);
    speck(cx + x * R, cy - y * R, c, size, light, (light ? 0.75 : 0.85) * depth * (0.5 + rnd() * 0.6));
  }
  ctx.globalCompositeOperation = "source-over";
}
function textMask(parts, fontPx, cx, cy) {
  const mask = document.createElement("canvas"); mask.width = W; mask.height = H;
  const m = mask.getContext("2d");
  m.textBaseline = "alphabetic"; m.fillStyle = "#fff";
  const widths = parts.map(([t, wgt]) => { m.font = `${wgt} ${fontPx}px Outfit`; return m.measureText(t).width; });
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  const base = cy + fontPx * 0.32;
  const boxes = [];
  parts.forEach(([t, wgt, draw = true], i) => {
    m.font = `${wgt} ${fontPx}px Outfit`;
    if (draw) m.fillText(t, x, base);
    boxes.push({ x, w: widths[i] });
    x += widths[i];
  });
  return { mask, box: { x0: cx - total / 2, x1: cx + total / 2, y0: base - fontPx * 0.78, y1: base + fontPx * 0.22 }, boxes, base };
}
function bg(light) { ctx.fillStyle = light ? "#ffffff" : "#000000"; ctx.fillRect(0, 0, W, H); }
function solidText(parts, fontPx, x, base, light) {
  ctx.fillStyle = light ? "#111114" : "#ffffff"; ctx.textBaseline = "alphabetic";
  for (const [t, wgt] of parts) { ctx.font = `${wgt} ${fontPx}px Outfit`; ctx.fillText(t, x, base); x += ctx.measureText(t).width; }
}

const ART = {
  /** 1–2. The whole word made of particles. */
  "wordmark-dark": () => wordmark(false),
  "wordmark-light": () => wordmark(true),
  /** 3–4. Only the "o" is particles; "rbital" stays solid. */
  "o-dark": () => particleO(false),
  "o-light": () => particleO(true),
  /** 5. The "o" replaced by the actual orb. */
  "orb-o-dark": () => orbO(false),
  /** 6. App icon. */
  "icon-dark": () => { bg(false); const r = W * 0.22; ctx.fillStyle = "#000"; orb(W / 2, H / 2, W * 0.31, 26000, false, [0.9, 3]); },
  "icon-light": () => { bg(true); orb(W / 2, H / 2, W * 0.31, 26000, true, [0.9, 3]); },
  /** 7. Social banner: orb on the left, particle wordmark and tagline. */
  "banner-dark": () => banner(false),
};
function wordmark(light) {
  bg(light);
  const fontPx = H * 0.5;
  const { mask, box } = textMask([["orb", 700], ["ital", 400]], fontPx, W / 2, H / 2);
  dust(box, 2600, light);
  particlesFromMask(mask, { step: Math.max(3, Math.round(W / 520)), size: [W / 1700, W / 650], light, box });
}
function particleO(light) {
  bg(light);
  const fontPx = H * 0.5;
  const parts = [["o", 700, true], ["rb", 700, false], ["ital", 400, false]];
  const { mask, box, boxes, base } = textMask(parts, fontPx, W / 2, H / 2);
  const ob = { x0: boxes[0].x, x1: boxes[0].x + boxes[0].w, y0: box.y0 + fontPx * 0.25, y1: box.y1 };
  dust(ob, 900, light, 0.45);
  particlesFromMask(mask, { step: Math.max(3, Math.round(W / 600)), size: [W / 1900, W / 700], light, box: ob });
  solidText([["rb", 700], ["ital", 400]], fontPx, boxes[1].x, base, light);
}
function orbO(light) {
  bg(light);
  const fontPx = H * 0.5;
  const parts = [["o", 700, false], ["rb", 700, false], ["ital", 400, false]];
  const { boxes, base } = textMask(parts, fontPx, W / 2, H / 2);
  const R = fontPx * 0.29, cx = boxes[0].x + boxes[0].w / 2, cy = base - fontPx * 0.245;
  orb(cx, cy, R, 9000, light, [W / 2600, W / 1000]);
  solidText([["rb", 700], ["ital", 400]], fontPx, boxes[1].x, base, light);
}
function banner(light) {
  bg(light);
  orb(W * 0.2, H * 0.5, H * 0.36, 16000, light, [0.8, 2.6]);
  const fontPx = H * 0.3;
  const { mask, box } = textMask([["orb", 700], ["ital", 400]], fontPx, W * 0.6, H * 0.43);
  particlesFromMask(mask, { step: 3, size: [0.9, 2.3], light, box });
  ctx.fillStyle = light ? "#55555d" : "#9a9aa3"; ctx.font = `400 ${H * 0.075}px Outfit`; ctx.textAlign = "center";
  ctx.fillText("Your intelligence. Compounding.", W * 0.6, H * 0.72);
}

document.fonts.load("700 100px Outfit").then(() => document.fonts.load("400 100px Outfit")).then(() => {
  (ART[art] || ART["wordmark-dark"])();
  document.title = "done";
});
</script>
</body>
</html>
