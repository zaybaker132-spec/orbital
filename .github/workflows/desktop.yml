# Builds Orbital desktop installers on real macOS, Windows and Linux runners.
# Publish a release on GitHub (Releases -> Draft a new release -> tag v0.2.0 -> Publish) and this
# workflow builds the installers and attaches them to it. Or run it manually from the Actions tab
# to get installers as downloadable artifacts without publishing.
name: Desktop builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:server
      - name: Package
        shell: bash
        env:
          # Optional code signing: add these repository secrets to sign (and notarize on macOS).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty signing variable makes electron-builder treat the working folder as a certificate
          # ("… not a file"), so drop every one that isn't set.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          extra=()
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # No certificate: ad-hoc sign Mac builds. Apple Silicon refuses to open unsigned apps ("damaged");
            # ad-hoc signed ones open after right-click → Open.
            [ "$RUNNER_OS" = "macOS" ] && extra+=("-c.mac.identity=-")
          fi
          npx electron-builder --publish never "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error

  release:
    # Attach whatever built, even if one platform failed, so a release is never left empty.
    if: ${{ !cancelled() && github.event_name == 'release' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*
