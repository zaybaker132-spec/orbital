# Desktop packaging for macOS, Windows and Linux.
# Build locally:   npm run desktop:dist      (builds for the current OS)
# Build all three: push a tag like v0.2.0 — .github/workflows/desktop.yml builds on real macOS/Windows/Linux runners.
appId: app.orbital.desktop
productName: Orbital
copyright: Copyright © Orbital
directories:
  output: release
  buildResources: build-resources
files:
  - package.json
  - desktop/**
  - desktop-build/**
  - dist/**
  - "!**/*.map"
# PGlite loads its WASM/data files from disk; keep them outside the asar archive.
asarUnpack:
  - node_modules/@electric-sql/**
# orbital:// links ("Activate in Orbital" after buying Pro).
protocols:
  - name: Orbital
    schemes: [orbital]
extraMetadata:
  main: desktop/main.cjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  darkModeSupport: true
  # Signing + notarization run automatically when CSC_LINK/CSC_KEY_PASSWORD and
  # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are set (see docs/DESKTOP.md).
  notarize: false
  # Shown when macOS asks for camera and microphone access (Meetings).
  extendInfo:
    NSCameraUsageDescription: Orbital uses your camera for video meetings.
    NSMicrophoneUsageDescription: Orbital uses your microphone for video meetings.
  entitlementsInherit: build-resources/entitlements.mac.plist
  entitlements: build-resources/entitlements.mac.plist
dmg:
  title: Orbital
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # Signing runs when CSC_LINK/CSC_KEY_PASSWORD (or Azure Trusted Signing vars) are set.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Orbital
  artifactName: Orbital-Setup-${version}.${ext}
linux:
  target: [AppImage, deb]
  category: Office
  maintainer: Orbital
# Updates: the app checks this repository's latest GitHub release (latest.yml / latest-mac.yml /
# latest-linux.yml, attached by .github/workflows/desktop.yml). The workflow builds with
# --publish never and attaches the files itself.
publish:
  provider: github
  owner: zaybaker132-spec
  repo: orbital
  releaseType: release
