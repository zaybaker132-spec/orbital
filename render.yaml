# One-click hosting on Render (render.com → New → Blueprint → pick this repository).
# The database lives elsewhere (Supabase or Neon): paste its connection string as DATABASE_URL when asked.
# Step-by-step guide: docs/DEPLOY.md
services:
  - type: web
    name: orbital
    runtime: node
    # free: $0, sleeps after 15 min without visitors (about a minute to wake). Switch to starter ($7/month) to keep it awake.
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Postgres connection string ("Session pooler" on Supabase). Never commit it.
      - key: DATABASE_URL
        sync: false
      # Encrypts stored secrets (webhook URLs, tokens). Generated once by Render; keep it forever.
      - key: ORBITAL_SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # Your site's address, e.g. https://orbital.yourdomain.com (used in invite links).
      - key: ORBITAL_PUBLIC_URL
        sync: false
      # Your email: you can see the waitlist and let people in.
      - key: ORBITAL_ADMIN_EMAILS
        sync: false
      # Start invite-only: people join the waitlist; set to true to open sign-ups to everyone.
      - key: ORBITAL_ALLOW_SIGNUP
        value: "false"
      # Render terminates TLS in one proxy in front of the app: trust it for client IPs and https.
      - key: ORBITAL_TRUST_PROXY
        value: "1"
      # Email for password reset and waitlist confirmations (resend.com). Without it, no email is sent.
      - key: RESEND_API_KEY
        sync: false
      # A sender on your verified domain, e.g. Orbital <hello@yourdomain.com>
      - key: ORBITAL_EMAIL_FROM
        sync: false
      # Monthly AI token allowance per workspace (0 = unlimited). Protects your Anthropic bill.
      - key: ORBITAL_AI_MONTHLY_TOKENS
        value: "2000000"
      # Optional Slack-compatible webhook for server error alerts.
      - key: ORBITAL_ALERT_WEBHOOK
        sync: false
      # Media library storage per workspace (MB). Supabase's free database is 500 MB in total.
      - key: MEDIA_QUOTA_MB
        value: "250"
      - key: MEDIA_MAX_MB
        value: "200"
